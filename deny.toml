[advisories]
unsound = "all"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Transitive GTK3 build dependency; revisit when the Tauri Linux stack updates." },
  { id = "RUSTSEC-2024-0429", reason = "Transitive GTK3 dependency; revisit before supporting Linux and when upstream updates." },
]

[licenses]
version = 2
include-dev = true
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
